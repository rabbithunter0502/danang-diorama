      o.type = 'square'; o.frequency.value = f0; o.connect(lp); lp.connect(og); og.connect(master);
      og.gain.setValueAtTime(0, w); og.gain.linearRampToValueAtTime(g, w + 0.01); og.gain.setValueAtTime(g, w + 0.12); og.gain.linearRampToValueAtTime(0, w + 0.16);
      o.start(w); o.stop(w + 0.2);
    }
  }
}

// ---- every frame, from updateNight
function updateWorld(t, dt, n) {
  wxRain += ((wxMode === 1 ? 1 : 0) - wxRain) * Math.min(1, dt * 0.5);
  wxMist += ((wxMode === 2 ? 1 : 0) - wxMist) * Math.min(1, dt * 0.5);
  const wet = Math.max(wxRain, wxMist * 0.85);
  // lights come on with the dusk, and earlier under a heavy sky
  const te = Math.max(timeV, wet * 0.36);
  if (Math.abs(te - lastTe) > 1e-4) {
    lastTe = te;
    for (const e of STAGED) { const f = sstep(e.th, e.th + 0.1, te); e.o.material.opacity = e.op * f; e.o.visible = f > 0.003; }
    lampHead.color.copy(LAMP_OFF).lerp(LAMP_ON, sstep(0.05, 0.35, te));
    winP = lerp(0.08, 0.62, sstep(0.05, 0.8, te));
    if (Math.abs(winP - winPShown) > 0.004) applyWins();
  }
  // a grey, low sky, short sight lines and dimmed sun in rain and mist
  uWet.value = wet * 0.85;
  greyC.copy(GREY_DAY).lerp(GREY_NIGHT, n); FOG.lerp(greyC, wet * 0.75);
  scene.fog.near = FOG_NEAR * (1 - 0.95 * wet); scene.fog.far = FOG_FAR * (1 - 0.8 * wxRain - 0.88 * wxMist * (1 - wxRain));
  waterMat.uniforms.uFogNear.value = scene.fog.near; waterMat.uniforms.uFogFar.value = scene.fog.far;
  sunLight.intensity *= 1 - 0.75 * wet; sun.material.opacity *= 1 - wet;
  for (const [m, c] of ROAD_C) m.color.copy(c).multiplyScalar(1 - 0.28 * wxRain);
  rain.visible = wxRain > 0.01; rain.material.opacity = 0.42 * wxRain * (1 - 0.4 * n); if (rain.visible) updateRain(t);
  const ma = Math.max(wxMist, wxRain * 0.55);
  for (const m of mist) {
    m.s.visible = ma > 0.01; if (!m.s.visible) continue;
    m.s.position.set(m.x + Math.sin(t * 0.04 + m.ph) * 12, m.y + Math.sin(t * 0.07 + m.ph) * 2, m.z + Math.cos(t * 0.05 + m.ph) * 10);
    m.s.material.opacity = m.op * ma; m.s.material.color.copy(MIST_DAY).lerp(GREY_NIGHT, n * 0.9);
  }
  const rv = wxRain * sstep(0.1, 0.4, te);
  refl.visible = rv > 0.02;
  if (refl.visible) {
    reflM.opacity = 0.5 * rv;
    LAMP_POS.forEach(([x, y, z], i) => { dummy.position.set(x, y + 0.12, z); dummy.rotation.set(0, Math.atan2(camera.position.x - x, camera.position.z - z), 0); dummy.scale.set(2.6, 1, 11); dummy.updateMatrix(); refl.setMatrixAt(i, dummy.matrix); });
    refl.instanceMatrix.needsUpdate = true;
  }
  updateDragon(t, dt);
  updateSound(t, n);
}

// ---------------------------------------------------------------- the loop
const clock = new THREE.Clock();
let t = 0, flickerAcc = 0;
const tmpV = new THREE.Vector3();
let lastFrame = -1e9;
function frame(now) {
  if (LOW_POWER && now - lastFrame < 32) { requestAnimationFrame(frame); return; }
  lastFrame = now;
  const dt = Math.min(0.05, clock.getDelta());
  if (!still) t += dt;
  uTime.value = t;
  if (fly) { fly.t = Math.min(1, fly.t + dt / 1.6); const k = sstep(0, 1, fly.t); camera.position.lerpVectors(fly.p0, fly.to.pos, k); controls.target.lerpVectors(fly.q0, fly.to.target, k); if (fly.t >= 1) fly = null; }
  controls.update();
  if (inDisc(camera.position.x, camera.position.z, 2)) { const gy = H(camera.position.x, camera.position.z) + 3; if (camera.position.y < gy) camera.position.y = gy; }
  skyGroup.position.copy(camera.position);

  updateClouds(t); updateBeach(t); updateNight(t, dt);
  wheel.rotation.z = -t * TAU / 48;
  for (const c of cabins) { const a = c.a - t * TAU / 48; c.c.position.set(Math.cos(a) * c.RAD, c.AX + Math.sin(a) * c.RAD, 0); c.c.rotation.z = Math.sin(t * 1.3 + c.a) * 0.06; }
  wheelLights.forEach((L, k) => { const b = 0.55 + 0.45 * Math.sin(t * 2.6 - k * 0.55); L.gl.material.opacity = 0.35 + 0.6 * b; });
  updateTraffic(t, dt);
  // ride along behind one of the vans
  if (follow >= 0) {
    if (!cars[follow].g.visible) { for (let k = 1; k <= cars.length; k++) { const n = (follow + k) % cars.length; if (cars[n].g.visible) { follow = n; break; } } }
    // a chase camera with per-ride framing: it trails along the road itself, eased so it glides, looking well ahead
    const car = cars[follow], rd = RIDES[rideIdx] || {}, back = car.len / 2 + (rd.back || 11), side = rd.side || 0;
    const pb = car.route.at(car.d - back), pa = car.route.at(car.d - back - 8), pf = car.route.at(car.d + 18);
    const hx = pb.x - pa.x, hz = pb.z - pa.z, hl = Math.hypot(hx, hz) || 1, cx = pb.x - hz / hl * side, cz = pb.z + hx / hl * side;
    const cy = Math.max(pb.y, car.q.y, H(cx, cz) + 2.5) + (rd.h || 6) + car.len * 0.2;
    // the chase position swung round the car by the visitor's drag; the swing is eased so the camera turns smoothly round the car
    // instead of cutting across, and a spring arm pulls it in (and up a little) whenever a building would hide the car
    const ek = Math.min(1, dt * 3.5); yawS += (followYaw - yawS) * ek; pitchS += (followPitch - pitchS) * ek; zoomS += (followZoom - zoomS) * ek;
    const q = car.q, ox = cx - q.x, oz = cz - q.z, cs = Math.cos(yawS), sn = Math.sin(yawS), zm = zoomS, ey = q.y + 1.3;
    let fx = q.x + (ox * cs - oz * sn) * zm, fz = q.z + (ox * sn + oz * cs) * zm, fy = Math.max(q.y + (cy - q.y) * zm + pitchS * 12 * zm, H(fx, fz) + 2.5, q.y + 1.2);
    // a building in the way: first rise over the rooftops (eased, quick up and slow down, so passing gaps do not make it bob),
    // and only if that is not enough pull in towards the car
    let need = 0; while (need < 30 && camClear(q.x, ey, q.z, fx, fy + need, fz) < 1) need += 3;
    liftS += (need - liftS) * Math.min(1, dt * (need > liftS ? 4 : 0.7)); fy += liftS;
    const clr = camClear(q.x, ey, q.z, fx, fy, fz);
    if (clr < 1) { const k = Math.max(0.22, clr - 0.06); fx = q.x + (fx - q.x) * k; fz = q.z + (fz - q.z) * k; fy = Math.max(ey + (fy - ey) * k + (1 - k) * 2.5, H(fx, fz) + 2.5); }
    const look = Math.min(1, Math.abs(Math.atan2(sn, cs)) / 0.9 + Math.max(0, pitchS) * 0.5);
    camera.position.lerp(tmpV.set(fx, fy, fz), 1 - Math.exp(-dt * (clr < 1 ? 6 : 3)));
    controls.target.lerp(new THREE.Vector3(lerp(pf.x, q.x, look), lerp(pf.y + 1.8, q.y + 1.4, look), lerp(pf.z, q.z, look)), 1 - Math.exp(-dt * 3.2));
  }
  for (const b of boats) { const ph = t * b.v / b.A + b.ph, x = b.c + b.A * Math.sin(ph), dir = Math.cos(ph) >= 0 ? 1 : -1; b.g.position.set(x, Math.sin(t * 1.1 + b.ph) * 0.25, b.z); b.g.rotation.set(Math.sin(t * 0.9 + b.ph) * 0.02, dir > 0 ? 0 : Math.PI, Math.sin(t * 0.7 + b.ph) * 0.02); }
  for (const b of birds) {
    const a = b.ph + t * b.sp, flap = Math.sin(t * 0.7 + b.ph) > -0.3 ? Math.sin(t * b.ff + b.ph) : 0.3;
    b.g.position.set(b.cx + Math.cos(a) * b.r, b.cy + Math.sin(t * 0.5 + b.ph) * 6, b.cz + Math.sin(a) * b.r);
    b.g.rotation.set(0, -a + (b.sp > 0 ? 0 : Math.PI), Math.cos(a) * 0.2);
    b.L.rotation.z = flap * 0.6; b.Rw.rotation.z = -flap * 0.6;
  }
  flickerAcc += dt;
  if (flickerAcc > 0.25 && !still) { flickerAcc = 0; for (let k = 0; k < 6; k++) { const i = Math.floor(R() * wins.length); if (winState[i] === 2) continue; winTh[i] = R(); winState[i] = winTh[i] < winP ? 1 : 0; winMesh.setColorAt(i, winState[i] ? winCol[i] : WIN_OFF); } winMesh.instanceColor.needsUpdate = true; }
  // moon glint every eleven seconds
  const me = t % 11, mk = me < 1.6 ? Math.sin(Math.PI * me / 1.6) : 0;
  glint.material.opacity = mk; glint.scale.setScalar(40 + 120 * mk); glint.material.rotation = 0.25 + me * 0.15; moonHalo.material.opacity = 0.35 * mk;
  // the comet, every 24 seconds, first after 5
  const ct = -1;
  if (ct > 0) {
    const n = Math.floor(ct / 24), te = ct - n * 24, FLY = 3.4, FADE = 1.8;
    if (te < FLY + FADE) {
      const az0 = (-4 - 10 * hash(n)) * DEG, el0 = (34 + 6 * hash(n + 7)) * DEG, az1 = (-58 - 10 * hash(n + 13)) * DEG, el1 = (10 + 5 * hash(n + 21)) * DEG;
      const P = (u, off) => { const az = lerp(az0, az1, u) + off * (u - 0.42) * (u > 0.42 ? 1 : 0), el = lerp(el0, el1, u) + Math.sin(Math.PI * u) * 3 * DEG - off * 0.6 * (u - 0.42) * (u > 0.42 ? 1 : 0); return dirAzEl(az, el).multiplyScalar(3000); };
      const uh = Math.min(1, te / FLY), out = te > FLY ? (te - FLY) / FADE : 0, split = hash(n + 41) < 0.75;
      const half = split ? COMET_N / 2 : COMET_N;
      for (let i = 0; i < COMET_N; i++) {
        const frag = i >= half, j = frag ? i - half : i, m = frag ? COMET_N - half : half, f = 1 - j / m;
        const u = uh - (1 - f) * 0.34 + out * 0.34 * (1 - f);
        const p = P(clamp(u), frag ? 0.08 : 0);
        cometPos.set([p.x, p.y, p.z], i * 3);
        const ok = u >= 0 && (!frag || u > 0.42);
        cometA[i] = ok ? Math.pow(f, 1.3) * (1 - out) * (frag ? 0.8 : 1) : 0; cometS[i] = (frag ? 7 : 10) + (frag ? 22 : 34) * Math.pow(f, 2); cometT[i] = f;
      }
      cometGeo.attributes.position.needsUpdate = true; cometGeo.attributes.aA.needsUpdate = true; cometGeo.attributes.aS.needsUpdate = true; cometGeo.attributes.aT.needsUpdate = true;
      const hp = P(uh, 0); cometHead.position.copy(hp); cometHead.material.opacity = out ? 0 : 0.95;
    } else { cometA.fill(0); cometGeo.attributes.aA.needsUpdate = true; cometHead.material.opacity = 0; }
  }

  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  requestAnimationFrame(frame);
}
loadingEl.hidden = true;
requestAnimationFrame(frame);
})();
